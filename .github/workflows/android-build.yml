name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you press "Run workflow" by hand

permissions:
  contents: write # needed to publish the release

env:
  NDK_VERSION: "27.0.12077973"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already ships the Android SDK, so no setup action is needed.
      - name: Install Android SDK pieces and NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      # Generates src-tauri/gen/android if you haven't committed it.
      - name: Init Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi

      # Android icons must be generated AFTER the Android project exists, otherwise the
      # default Tauri icon is used. app-icon.png is the logo with padding for adaptive icons.
      - name: Generate app icons from the logo
        run: npx tauri icon src-tauri/icons/app-icon.png

      # Hide the status bar (clock/notifications) while the app is open. A swipe down from the
      # top edge shows it briefly. The package line is copied from the generated file.
      - name: Hide the status bar
        run: |
          FILE=$(find src-tauri/gen/android -name MainActivity.kt | head -n 1)
          PKG=$(grep -m 1 '^package ' "$FILE")
          cat > "$FILE" <<EOF
          $PKG

          import android.os.Build
          import android.os.Bundle
          import android.view.WindowManager
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : TauriActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              hideStatusBar()
            }

            override fun onWindowFocusChanged(hasFocus: Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if (hasFocus) hideStatusBar()
            }

            private fun hideStatusBar() {
              WindowCompat.setDecorFitsSystemWindows(window, false)
              if (Build.VERSION.SDK_INT >= 28) {
                window.attributes.layoutInDisplayCutoutMode =
                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
              }
              val controller = WindowInsetsControllerCompat(window, window.decorView)
              controller.hide(WindowInsetsCompat.Type.statusBars())
              controller.systemBarsBehavior =
                WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
            }
          }
          EOF
          cat "$FILE"

      # aarch64 covers practically every modern phone and keeps the build short.
      - name: Build APK
        run: npm run tauri android build -- --apk --debug --target aarch64

      - name: Collect APK
        run: |
          APK=$(find src-tauri/gen/android -name '*.apk' | head -n 1)
          echo "Found: $APK"
          cp "$APK" chess-learning-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chess-learning-app-apk
          path: chess-learning-app.apk

      # Replaces a single "latest" release each time, so the download link stays the same.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest chess-learning-app.apk \
            --title "Latest build" \
            --notes "Built from commit ${GITHUB_SHA::7}" \
            --prerelease
